name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository. Overrides the repository-level
# default so the token stays read-only even if that setting is widened later.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          WVD_SECRET_KEY: ci-test-key
        run: python manage.py check

      - name: Run tests
        env:
          WVD_SECRET_KEY: ci-test-key
        run: python manage.py test weather

  browser-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pytest tests/e2e/

  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Robot Framework dependencies
        run: pip install -r requirements-robot.txt

      - name: Initialize Browser library (installs its own Playwright/Node deps)
        run: rfbrowser init

      # WVD_REDIS_URL is intentionally left unset so the suite uses LocMemCache —
      # see tests/robot/resources/common.resource for why that matters for the
      # rate-limiting tests.
      - name: Run Robot Framework smoke tests
        env:
          WVD_SECRET_KEY: ci-test-key
        run: robot --outputdir tests/robot/results -i smoke tests/robot

      - name: Upload Robot Framework report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results
          path: tests/robot/results/
